<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName loupgarou.imgnlab.dev

    # ---------------------------------------------------------
    # Loup-Garou de Thiercelieux : Apache sert le client compilé (client/dist),
    # Node (pm2 « loupgarou », 127.0.0.1:3110) ne gère que socket.io (/socket.io/).
    # Code : /var/www/imgnlab/prod/loupgarou
    # ---------------------------------------------------------
    DocumentRoot /var/www/imgnlab/prod/loupgarou/client/dist

    <Directory /var/www/imgnlab/prod/loupgarou/client/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Fichiers à nom haché (JS, CSS, polices) : cache long. Les modèles (assets/camp, assets/characters)
    # et index.json gardent le même nom d'une version à l'autre : revalidés.
    <LocationMatch "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <LocationMatch "^/assets/(camp|characters)/|^/assets/index\.json$|^/index\.html$|^/$">
        Header set Cache-Control "no-cache"
    </LocationMatch>
    AddType model/gltf-binary .glb

    # socket.io : polling HTTP et WebSocket sur le même chemin.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    ProxyPass        /socket.io/ http://127.0.0.1:3110/socket.io/ upgrade=websocket
    ProxyPassReverse /socket.io/ http://127.0.0.1:3110/socket.io/

    ErrorLog ${APACHE_LOG_DIR}/loupgarou.error.log
    CustomLog ${APACHE_LOG_DIR}/loupgarou.access.log combined

SSLCertificateFile /etc/letsencrypt/live/loupgarou.imgnlab.dev/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/loupgarou.imgnlab.dev/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
